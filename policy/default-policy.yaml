# AgentGuard default policy — Phase 1 reference configuration.
# See README.md "Configuring policies" for the full schema and the
# documented reasoning behind each default (why .env is WARN but
# ~/.ssh is BLOCK, why shell defaults to deny-by-default, etc).

filesystem:
  # Optional allowlist. Left empty here: filesystem access is unrestricted
  # except for the deny/warn rules below. Set this per-project, e.g.
  # ["./workspace/**"], to also WARN on anything outside your project dir.
  allow: []

  # BLOCK, risk CRITICAL. No legitimate agent workflow needs these.
  deny:
    - "~/.ssh/**"
    - "~/.aws/**"
    - "~/.aws/credentials"
    - "~/.config/gcloud/**"
    - "~/.kube/**"
    - "**/id_rsa"
    - "**/id_ed25519"
    - "**/*.pem"

  # WARN, risk MEDIUM. Often legitimately read by tooling/tests, so a hard
  # block would break normal dev workflows — but worth surfacing.
  # NOTE: a bare ".env" only matches that exact relative string. Tool calls
  # use ./.env, absolute paths (the MCP filesystem server requires them),
  # Windows paths, and .env.local-style variants, so these need the "**/"
  # prefix to fire in practice (F11 in SECURITY-ASSESSMENT.md).
  warn:
    - "**/.env"
    - "**/.env.*"
    - "**/credentials.json"
    - "**/secrets.yaml"

shell:
  # Deny-by-default: only binaries listed here may be invoked through an
  # MCP shell/exec-style tool call, or through `agentguard exec`. An empty
  # allowed list blocks all shell execution.
  #
  # Deliberately NOT including general-purpose interpreters (node, python,
  # sh, powershell, ...) here: shell.allowed only ever inspects the binary
  # name, so allowing an interpreter effectively allows arbitrary code
  # execution through it (see SECURITY-ASSESSMENT.md F2). If you add one
  # back, understand that block_interpreter_eval below only catches the
  # single most blatant case (an inline -e/-c/-Command flag) — it is not a
  # general solution.
  allowed:
    - git
    - npm

  # Checked BEFORE `allowed` and always wins, even if a binary also
  # appears in `allowed` — a second layer for the handful of commands
  # that should never run regardless of what else is permitted.
  deny:
    - rm
    - shutdown
    - reboot

  # BLOCKs a known interpreter (node/python/sh/bash/powershell/cmd/...)
  # invoked with its inline-code flag, even if that interpreter is itself
  # in shell.allowed — see SECURITY-ASSESSMENT.md F2. Narrow and
  # deliberately incomplete (does not catch e.g. writing a script to a
  # file first); set false only if this deployment has already accepted
  # that risk.
  block_interpreter_eval: true

mcp:
  # Empty = trust all configured MCP servers (no reputation data in Phase 1).
  # List specific server names to WARN on anything not explicitly trusted.
  allowed_servers: []

network:
  # Empty = no restriction. Only domains visible in MCP tool-call arguments
  # can be checked at all (see README limitations on network visibility).
  allowed_domains: []

secrets:
  # BLOCK any tool-call argument that matches a known secret pattern
  # (AWS access key, private key block, generic api-key/token assignment).
  block_exfiltration: true

mcp_response_inspection:
  # BLOCK a tool-call response containing a known secret pattern - mirrors
  # the request-side default.
  block_on_secret_pattern: true
  # Log-only by default: matching an instruction-injection-shaped pattern in
  # a response is a detection signal worth surfacing, not proof of anything.
  # Set true to actually block forwarding such a response to the agent.
  block_on_suspicious_instruction: false
